<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 个人知识库 · 问答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #f0f2f5; color: #1f2329; height: 100vh; display: flex;
  }
  /* ── 登录遮罩 ── */
  #login-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.55);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  #login-mask.hidden { display: none; }
  .login-card {
    background: #fff; border-radius: 12px; padding: 32px 36px; width: 340px;
    box-shadow: 0 12px 40px rgba(0,0,0,.2);
  }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card .sub { color: #86909c; font-size: 13px; margin-bottom: 20px; }
  .login-card input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #dcdfe6;
    border-radius: 8px; font-size: 14px; outline: none;
  }
  .login-card input:focus { border-color: #4e6ef2; }
  .login-card button {
    width: 100%; padding: 10px; background: #4e6ef2; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; cursor: pointer;
  }
  .login-card button:hover { background: #3d5bdb; }
  .login-card .err { color: #f53f3f; font-size: 13px; min-height: 18px; margin-top: 8px; }

  /* ── 主布局 ── */
  #main { display: flex; width: 100%; height: 100%; }
  #main.hidden { display: none; }
  .sidebar {
    width: 260px; background: #fff; border-right: 1px solid #e5e6eb;
    display: flex; flex-direction: column; padding: 16px;
  }
  .sidebar h2 { font-size: 15px; margin-bottom: 12px; }
  .sidebar .user-line { font-size: 13px; color: #86909c; margin-bottom: 12px; }
  .doc-item {
    padding: 10px 12px; border: 1px solid #e5e6eb; border-radius: 8px; margin-bottom: 8px;
    font-size: 13px;
  }
  .doc-item .name { font-weight: 600; word-break: break-all; }
  .doc-item .meta { color: #86909c; font-size: 12px; margin-top: 4px; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; margin-left: 6px;
  }
  .badge.ok { background: #e8f7ee; color: #00b42a; }
  .badge.wait { background: #fff7e8; color: #ff7d00; }
  .badge.err { background: #ffece8; color: #f53f3f; }
  .sidebar .btn-new {
    margin-top: auto; padding: 9px; border: 1px solid #4e6ef2; color: #4e6ef2;
    background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .sidebar .btn-new:hover { background: #f2f4ff; }

  .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header {
    padding: 14px 24px; background: #fff; border-bottom: 1px solid #e5e6eb;
    font-size: 15px; font-weight: 600;
  }
  #messages { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { margin-bottom: 20px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.7;
    font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #4e6ef2; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #fff; border: 1px solid #e5e6eb; border-bottom-left-radius: 4px; }
  .sources { margin-top: 8px; font-size: 12px; color: #86909c; }
  .sources .src { display: block; margin-top: 2px; }
  .hint { color: #c9cdd4; text-align: center; font-size: 13px; margin-top: 30vh; }

  .input-bar {
    padding: 16px 24px; background: #fff; border-top: 1px solid #e5e6eb; display: flex; gap: 12px;
  }
  .input-bar textarea {
    flex: 1; resize: none; height: 48px; padding: 12px; border: 1px solid #dcdfe6;
    border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; line-height: 1.4;
  }
  .input-bar textarea:focus { border-color: #4e6ef2; }
  .input-bar button {
    width: 90px; border: none; border-radius: 8px; background: #4e6ef2; color: #fff;
    font-size: 15px; cursor: pointer;
  }
  .input-bar button:disabled { background: #a9b4e8; cursor: not-allowed; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login-mask">
  <div class="login-card">
    <h1>RAG 个人知识库</h1>
    <div class="sub">基于 LangChain + Milvus + MySQL/Postgres</div>
    <input id="login-user" placeholder="用户名" autocomplete="username">
    <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
    <button onclick="login()">登 录</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="main" class="hidden">
  <div class="sidebar">
    <h2>已入库文档</h2>
    <div class="user-line" id="user-line"></div>
    <div id="doc-list"></div>
    <button class="btn-new" onclick="newSession()">＋ 新会话</button>
  </div>
  <div class="chat-panel">
    <div class="chat-header" id="chat-header">知识库问答</div>
    <div id="messages">
      <div class="hint">登录后即可提问，例如：LangChain 和 LangGraph 有什么区别？</div>
    </div>
    <div class="input-bar">
      <textarea id="input" placeholder="输入问题，Enter 发送 / Shift+Enter 换行"></textarea>
      <button id="send-btn" onclick="send()">发送</button>
    </div>
  </div>
</div>

<script>
let token = null, sessionId = null, busy = false;

async function api(path, method = "GET", body = null) {
  const opts = { method, headers: {} };
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (body !== null) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
  return data;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function login() {
  const u = document.getElementById("login-user").value.trim();
  const p = document.getElementById("login-pass").value;
  const err = document.getElementById("login-err");
  err.textContent = "";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "username=" + encodeURIComponent(u) + "&password=" + encodeURIComponent(p),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "登录失败");
    token = data.access_token;
    document.getElementById("login-mask").classList.add("hidden");
    document.getElementById("main").classList.remove("hidden");
    document.getElementById("user-line").textContent = "当前用户：" + u + "（" + data.role + "）";
    newSession();
    loadDocs();
  } catch (e) {
    err.textContent = e.message;
  }
}

async function loadDocs() {
  try {
    const docs = await api("/api/documents");
    const box = document.getElementById("doc-list");
    box.innerHTML = docs.map(d => {
      const cls = d.sync_status === "in_sync" ? "ok" : (d.sync_status === "pending" ? "wait" : "err");
      return `<div class="doc-item">
        <div class="name">${esc(d.file_name)}<span class="badge ${cls}">${d.sync_status}</span></div>
        <div class="meta">v${d.version} · ${d.chunk_count} chunks</div>
      </div>`;
    }).join("") || '<div class="doc-item" style="color:#86909c">知识库暂无文档</div>';
  } catch (e) {
    document.getElementById("doc-list").innerHTML = `<div style="color:#f53f3f;font-size:12px">加载文档列表失败：${esc(e.message)}</div>`;
  }
}

function addMsg(role, text, sources) {
  const box = document.getElementById("messages");
  const hint = box.querySelector(".hint");
  if (hint) hint.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  let html = `<div class="bubble">${esc(text)}</div>`;
  if (sources && sources.length) {
    html += `<div class="sources">${sources.map(s =>
      `<span class="src">[${s.index}] ${esc((s.source || "未知来源").split(/[\\/]/).pop())}（精排分 ${s.score != null ? s.score : "—"}）</span>`
    ).join("")}</div>`;
  }
  div.innerHTML = html;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  addMsg("user", text);
  busy = true;
  document.getElementById("send-btn").disabled = true;
  try {
    const r = await api("/api/chat", "POST", { content: text, session_id: sessionId });
    sessionId = r.session_id;
    addMsg("assistant", r.answer || "(空回答)", r.sources || []);
    if (r.error) addMsg("assistant", "[系统提示] " + r.error);
  } catch (e) {
    addMsg("assistant", "请求失败：" + e.message);
  } finally {
    busy = false;
    document.getElementById("send-btn").disabled = false;
    document.getElementById("input").focus();
  }
}

function newSession() {
  sessionId = null;
  document.getElementById("messages").innerHTML =
    '<div class="hint">新会话已开始，多轮记忆按会话隔离</div>';
  document.getElementById("input").focus();
}

document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("login-pass").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
