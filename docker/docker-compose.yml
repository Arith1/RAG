# ─────────────────────────────────────────────────────────────
# RAG 个人知识库 · 一键编排
#
# 启动（二选一）：
#   cd docker && docker compose up -d --build          # 在 docker/ 目录内
#   docker compose -f docker/docker-compose.yml up -d --build   # 项目根目录
# 停止：  docker compose down          （加 -v 会连数据卷一起删）
# 查看：  docker compose logs -f api
#
# 服务说明：
#   mysql    业务元数据（users/vector_files/chunk_records/audit_logs）
#   etcd+minio  Milvus standalone 的依赖（元数据存储 + 对象存储）
#   milvus   向量库
#   redis    入库任务队列 / 限流
#   postgres 对话记忆
#   api      FastAPI 应用（构建自 docker/Dockerfile，context=项目根）
#
# 注意：
#   1. 密钥从根目录 .env 注入（SILICONFLOW_API_KEY / MINERU_API_TOKEN /
#      DEEPSEEK_API_KEY / JWT_SECRET / ADMIN_* 等），先 cp .env.example .env 并填写
#   2. Postgres 对话记忆的 created_at 列：首次问答后 langgraph 自动建表，
#      再执行一次：docker compose exec postgres psql -U root -d rag-demo \
#        -f /init-sql/postgres_memory.sql（已挂载到容器）
# ─────────────────────────────────────────────────────────────
services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rag_demo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init/01-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
      - ../rag个人知识库/models:/init-sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: rag-demo
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../rag个人知识库/models/postgres_memory.sql:/init-sql/postgres_memory.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d rag-demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile  # Dockerfile 与 compose 同在 docker/ 目录，context 用项目根
    container_name: rag-api
    ports:
      - "8010:8010"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
    env_file:
      - ../.env
    environment:
      # 容器内通过服务名互联，覆盖 .env 里的 localhost 地址
      ASYNC_DATABASE_URL: mysql+aiomysql://root:root@mysql:3306/rag_demo?charset=utf8
      MEMORY_DATABASE_URL: postgresql://root:root@postgres:5432/rag-demo
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
    volumes:
      # 文档与上传产物持久化到宿主机（resources 已 gitignore）
      - ../rag个人知识库/resources:/app/rag个人知识库/resources
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  milvus-data:
  pg-data:
