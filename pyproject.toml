[project]
name = "rag-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.2.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.1",
    "langchain-deepseek>=1.1.0",
    "langchain-milvus>=0.4.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.2",
    "lxml>=6.1.1",
    "oss2>=2.18.0",
    "psycopg-binary>=3.3.4",
    "pyjwt>=2.13.0",
    "pymilvus>=3.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "unstructured>=0.24.1",
    "uvicorn[standard]>=0.52.3",
]

[project.optional-dependencies]
dev = [
    "deepeval>=1.0.0",
    "ipykernel>=7.3.0",
    "pytest>=9.0.0",
]

[dependency-groups]
dev = [
    "deepeval>=1.0.0",
]
